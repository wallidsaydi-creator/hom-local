name: Weekly Stats

on:
  schedule:
    - cron: "3 10 * * 1"  # Every Monday at 10:03 UTC
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Gather stats
        id: stats
        run: |
          # GitHub stats
          STARS=$(gh api repos/wallidsaydi-creator/hom-local --jq '.stargazers_count')
          FORKS=$(gh api repos/wallidsaydi-creator/hom-local --jq '.forks_count')
          OPEN_ISSUES=$(gh api repos/wallidsaydi-creator/hom-local --jq '.open_issues_count')

          # crates.io stats
          HOM_BRAIN=$(curl -s "https://crates.io/api/v1/crates/hom-brain" | jq -r '.crate.downloads // 0')
          HOM_SHARED=$(curl -s "https://crates.io/api/v1/crates/hom-shared" | jq -r '.crate.downloads // 0')
          HOM_INGRESS=$(curl -s "https://crates.io/api/v1/crates/hom-ingress" | jq -r '.crate.downloads // 0')
          TOTAL_DOWNLOADS=$((HOM_BRAIN + HOM_SHARED + HOM_INGRESS))

          # Weekly issues closed
          ISSUES_CLOSED=$(gh api repos/wallidsaydi-creator/hom-local/issues?state=closed --paginate --jq \
            '.[] | select(.closed_at >= (now - 604800 | todate)) | .number' | wc -l | tr -d ' ')

          # PRs merged this week
          PRS_MERGED=$(gh api repos/wallidsaydi-creator/hom-local/pulls?state=closed --paginate --jq \
            '.[] | select(.merged_at != null) | select(.merged_at >= (now - 604800 | todate)) | .number' | wc -l | tr -d ' ')

          # Write summary
          cat > /tmp/summary.md <<EOF
          # HOM Local - Weekly Stats

          **Week ending: $(date -u '+%Y-%m-%d')**

          ## Repository

          - Stars: $STARS
          - Forks: $FORKS
          - Open issues: $OPEN_ISSUES
          - Issues closed this week: $ISSUES_CLOSED
          - PRs merged this week: $PRS_MERGED

          ## crates.io Downloads

          - hom-brain: $HOM_BRAIN
          - hom-shared: $HOM_SHARED
          - hom-ingress: $HOM_INGRESS
          - **Total: $TOTAL_DOWNLOADS**

          ## Notes

          _Auto-generated by weekly-stats workflow._
          EOF

          echo "stars=$STARS" >> "$GITHUB_OUTPUT"
          echo "forks=$FORKS" >> "$GITHUB_OUTPUT"
          echo "total_downloads=$TOTAL_DOWNLOADS" >> "$GITHUB_OUTPUT"
          echo "issues_closed=$ISSUES_CLOSED" >> "$GITHUB_OUTPUT"
          echo "prs_merged=$PRS_MERGED" >> "$GITHUB_OUTPUT"

      - name: Create issue with stats
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/summary.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Stats: Stars ${{ steps.stats.outputs.stars }} | Downloads ${{ steps.stats.outputs.total_downloads }} | Closed ${{ steps.stats.outputs.issues_closed }} issues`,
              body: summary,
              labels: ['stats']
            });

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-stats
          path: /tmp/summary.md
          retention-days: 90
