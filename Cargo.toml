# SPDX-License-Identifier: Apache-2.0
[workspace]
members = [
  "crates/hom-shared",
  "crates/hom-brain",
  "crates/hom-ingress",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
version = "0.1.0"
description = "HOM Local — open-source local-first AI memory server"
repository = "https://github.com/wallidsaydi-creator/hom-local"
homepage = "https://github.com/wallidsaydi-creator/hom-local"
keywords = ["ai", "memory", "local-first", "brain", "recall"]
categories = ["memory", "ai"]

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
futures-util = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
