<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1278" height="638" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="640" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#e6edf3" text-anchor="middle">HOM Local</text>

  <!-- Subtitle -->
  <text x="640" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#8b949e" text-anchor="middle">Open-source local-first AI memory server</text>

  <!-- Feature pills -->
  <rect x="160" y="340" width="200" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="260" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">Memory Server</text>

  <rect x="380" y="340" width="220" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="490" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">Tamper-Evident Ledger</text>

  <rect x="620" y="340" width="200" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="720" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">Quality Gates</text>

  <rect x="840" y="340" width="220" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="950" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">Vector Search</text>

  <!-- Second row -->
  <rect x="220" y="400" width="200" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#3fb950" text-anchor="middle">Rust</text>

  <rect x="440" y="400" width="200" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="540" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#3fb950" text-anchor="middle">Apache-2.0</text>

  <rect x="660" y="400" width="200" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="760" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#3fb950" text-anchor="middle">188 Tests</text>

  <rect x="880" y="400" width="200" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="980" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#3fb950" text-anchor="middle">SQLite WAL</text>

  <!-- GitHub URL -->
  <text x="640" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">github.com/wallidsaydi-creator/hom-local</text>

  <!-- Tagline -->
